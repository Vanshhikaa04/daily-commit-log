name: Daily Auto Commits

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-auto-commits
  cancel-in-progress: false

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity
        run: |
          git config user.name "Vanshhikaa04"
          git config user.email "268219499+Vanshhikaa04@users.noreply.github.com"

      - name: Run daily commit bot
        run: python scripts/daily_commit.py
